name: Build Catalog Candidate

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full reviewed commit to package
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build and Attest Catalog Candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Require a full commit revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full lowercase Git commit hash" >&2
            exit 64
          fi
      - name: Checkout reviewed revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Validate and build catalog targets
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "${REVISION}"
          git merge-base --is-ancestor "${REVISION}" origin/main
          uv run heartwood-skill-catalog validate
          uv run heartwood-skill-catalog build --revision "${REVISION}"
          uv run pytest
      - name: Attest catalog candidate
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/catalog/**
      - name: Upload catalog candidate
        uses: actions/upload-artifact@v6
        with:
          name: heartwood-skill-catalog-${{ inputs.revision }}
          path: dist/catalog
          if-no-files-found: error
          retention-days: 30
