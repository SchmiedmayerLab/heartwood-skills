name: Pull Request Validation

on:
  pull_request:

concurrency:
  group: pull-request-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/python.yml
  secrets:
    name: Secret Scan
    uses: ./.github/workflows/secret-scan.yml
  validation:
    name: Repository Validation
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/validate.yml
  ready:
    name: Skill Repository Ready
    if: ${{ always() }}
    needs: [python, secrets, validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation workflow
        env:
          VALIDATION_RESULTS: ${{ toJson(needs) }}
        run: |
          jq --exit-status 'to_entries | all(.value.result == "success")' \
            <<<"${VALIDATION_RESULTS}"
